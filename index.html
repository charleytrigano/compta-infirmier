<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabilité Libérale</title>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1, h2 { color: #1e293b; }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        input, select { flex: 1; min-width: 160px; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
        }
        button:hover { background-color: #1d4ed8; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f1f5f9; }
        .btn-delete {
            background-color: #ef4444;
            padding: 6px 12px;
        }
        .btn-delete:hover { background-color: #dc2626; }
        .hint {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 Comptabilité Libérale</h1>

    <!-- SECTION 1 : PLAN COMPTABLE -->
    <div class="section">
        <h2>Plan Comptable du Cabinet</h2>
        
        <!-- Formulaire d'ajout de compte -->
        <div class="form-row">
            <input type="text" id="pcCode" placeholder="Code Compte (ex: 606300)">
            <input type="text" id="pcLibelle" placeholder="Libellé du compte">
            <select id="pcType">
                <option value="Charge">Charge (6...)</option>
                <option value="Produit">Produit (7...)</option>
                <option value="Trésorerie">Trésorerie (5...)</option>
            </select>
            <button onclick="ajouterComptePC()">+ Ajouter au Plan</button>
        </div>

        <!-- Tableau d'affichage des comptes -->
        <table>
            <thead>
                <tr>
                    <th>Code Compte</th>
                    <th>Libellé</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbodyPlanComptable">
                <tr>
                    <td colspan="4" style="text-align: center; color: #888;">Chargement...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SECTION 2 : SAISIE DE TRANSACTION ET SCAN -->
    <div class="section">
        <h2>Nouvelle Transaction & Scan de Justificatif</h2>
        <form id="formTransaction" onsubmit="enregistrerTransaction(event)">
            <div class="form-row">
                <div style="flex: 1;">
                    <label>Date :</label>
                    <input type="date" id="txDate" required style="width: 100%;">
                </div>
                <div style="flex: 2;">
                    <label>Libellé / Description :</label>
                    <input type="text" id="txLibelle" placeholder="Ex: Achat fournitures" required style="width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label>Montant (€) :</label>
                    <input type="number" step="0.01" id="txMontant" placeholder="0.00" required style="width: 100%;">
                </div>
            </div>
            
            <div class="form-row">
                <div style="flex: 1;">
                    <label>Compte Comptable :</label>
                    <select id="txCompte" required style="width: 100%;">
                        <option value="">Chargement des comptes...</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Scan / Justificatif :</label>
                    <input type="file" id="txFile" accept="image/*,application/pdf" capture="environment" style="width: 100%;">
                    <span class="hint">Sur mobile, ouvre la caméra pour scanner.</span>
                </div>
            </div>

            <button type="submit" id="btnSubmitTx" style="width: 100%; margin-top: 15px; padding: 12px;">Enregistrer la Transaction</button>
        </form>
    </div>
</div>

<!-- Chargement de la logique JavaScript -->
<script src="app.js"></script>

</body>
</html>
