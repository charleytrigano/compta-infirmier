<!-- ONGLET PLAN COMPTABLE -->
<div id="tab-plan-comptable" class="tab-content">
    
    <!-- Formulaire d'ajout -->
    <form id="pc-form" class="card">
        <h3>Ajouter un compte au Plan Comptable</h3>
        <div class="form-grid">
            <div>
                <label>Numéro de compte *</label>
                <input type="text" id="pc-code" placeholder="Ex: 606100" required>
            </div>
            <div>
                <label>Libellé du compte *</label>
                <input type="text" id="pc-label" placeholder="Ex: Électricité" required>
            </div>
            <div>
                <label>Type</label>
                <select id="pc-type">
                    <option value="Recette (Classe 7)">Recette (Classe 7)</option>
                    <option value="Charge (Classe 6)">Charge (Classe 6)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">+ Ajouter Compte</button>
        </div>
    </form>

    <!-- Tableau d'affichage -->
    <div class="card">
        <h3>Plan Comptable Général BNC</h3>
        <table>
            <thead>
                <tr>
                    <th>Code Compte</th>
                    <th>Libellé</th>
                    <th>Type</th>
                </tr>
            </thead>
            <!-- ATTENTION : Cet ID est obligatoire pour afficher les données -->
            <tbody id="pc-list">
                <!-- Les lignes s'afficheront ici grâce à JavaScript -->
            </tbody>
        </table>
    </div>

</div>
