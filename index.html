<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comptabilité Libérale</title>
  
  <!-- Styles Bootstrap & personnalisés -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .hidden { display: none !important; }
    .tab-btn.active { font-weight: bold; border-bottom: 2px solid #0d6efd; }
    #loading { text-align: center; padding: 50px; font-size: 1.2rem; color: #6c757d; }
  </style>
</head>
<body>

  <!-- Écran de chargement initial -->
  <div id="loading">Chargement de l'application...</div>

  <!-- Application Principale -->
  <div id="app" class="container py-4 hidden">

    <!-- En-tête -->
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
      <h1 class="h4 m-0">🩺 Comptabilité Libérale</h1>
      <span id="sync-status" class="badge bg-secondary">Connexion...</span>
    </header>

    <!-- Navigation Onglets -->
    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <button class="nav-link tab-btn active" onclick="showTab('transactions')">📄 Transactions</button>
      </li>
      <li class="nav-item">
        <button class="nav-link tab-btn" onclick="showTab('carpimko')">🏛️ CARPIMKO</button>
      </li>
      <li class="nav-item">
        <button class="nav-link tab-btn" onclick="showTab('profil')">👤 Profil</button>
      </li>
    </ul>

    <!-- Contenu Onglet Transactions -->
    <div id="tab-transactions" class="tab-content">
      
      <!-- Formulaire d'ajout d'opération -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Ajouter une opération</h5>
          <form id="form-operation">
            <div class="row g-3">
              <div class="col-md-2">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="col-md-2">
                <label for="type" class="form-label">Type</label>
                <select class="form-select" id="type">
                  <option value="Recette">Recette</option>
                  <option value="Dépense">Dépense</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="categorie" class="form-label">Catégorie</label>
                <select class="form-select" id="categorie"></select>
              </div>
              <div class="col-md-3">
                <label for="description" class="form-label">Description / Libellé</label>
                <input type="text" class="form-control" id="description" placeholder="Ex: Retrocession, Urssaf...">
              </div>
              <div class="col-md-2">
                <label for="montant" class="form-label">Montant (€)</label>
                <input type="number" step="0.01" class="form-control" id="montant" value="0.00" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">+ Ajouter</button>
          </form>
        </div>
      </div>

      <!-- Historique des transactions -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Historique des transactions</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Catégorie</th>
                  <th>Description</th>
                  <th style="text-align: right;">Montant (€)</th>
                </tr>
              </thead>
              <tbody id="transactions-tbody">
                <!-- Les lignes s'afficheront dynamiquement ici -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- Contenu Onglet Profil -->
    <div id="tab-profil" class="tab-content hidden">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Profil Professionnel</h5>
          <p><strong>Nom :</strong> <span id="nom">-</span></p>
          <p><strong>Prénom :</strong> <span id="prenom">-</span></p>
          <p><strong>SIRET :</strong> <span id="siret">-</span></p>
          <p><strong>Adresse :</strong> <span id="adresse">-</span></p>
        </div>
      </div>
    </div>

  </div>

  <!-- Chargement du SDK Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2"></script>
  
  <!-- Chargement unique du script applicatif -->
  <script src="app.js"></script>

</body>
</html>
