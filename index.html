<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabilité Libérale - Enregistrement & Scan</title>
    <!-- Chargement du SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .status-success {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nouvelle Transaction avec Justificatif</h2>
    
    <form id="formTransaction" onsubmit="enregistrerTransaction(event)">
        <!-- Date de la transaction -->
        <div class="form-group">
            <label for="dateTransaction">Date :</label>
            <input type="date" id="dateTransaction" required>
        </div>

        <!-- Libellé de la dépense/recette -->
        <div class="form-group">
            <label for="libelleTransaction">Libellé / Description :</label>
            <input type="text" id="libelleTransaction" placeholder="Ex: Achat petit matériel médical" required>
        </div>

        <!-- Montant -->
        <div class="form-group">
            <label for="montantTransaction">Montant (€) :</label>
            <input type="number" step="0.01" id="montantTransaction" placeholder="0.00" required>
        </div>

        <!-- Code compte associé -->
        <div class="form-group">
            <label for="compteTransaction">Compte Comptable :</label>
            <select id="compteTransaction" required>
                <option value="606300">606300 - Achats petit matériel</option>
                <option value="613200">613200 - Loyer professionnel</option>
                <option value="625100">625100 - Frais de déplacements</option>
                <option value="706000">706000 - Honoraires / Prestations</option>
            </select>
        </div>

        <!-- Champ d'importation / Scan du document -->
        <div class="form-group">
            <label for="fichierJustificatif">Scanner / Joindre le justificatif :</label>
            <input type="file" id="fichierJustificatif" accept="image/*,application/pdf" capture="environment">
            <small style="color: #666;">Sur smartphone, cela ouvrira directement l'appareil photo.</small>
        </div>

        <!-- Bouton d'action -->
        <button type="submit" id="btnSubmit">Enregistrer la transaction</button>
    </form>

    <!-- Zone d'affichage des messages de confirmation ou d'erreur -->
    <div id="messageStatut" class="status-message"></div>
</div>

<script>
    // =======================================================
    // 1. INITIALISATION DE SUPABASE
    // =======================================================
    const SUPABASE_URL = 'https://qfwhzuhwldurnmhirgil.supabase.co'; // Remplace par ton URL
    const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';             // Remplace par ta clé ANON

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initialise la date du jour par défaut dans le formulaire
    document.getElementById('dateTransaction').valueAsDate = new Date();

    // =======================================================
    // 2. FONCTION : UPLOAD DU JUSTIFICATIF SUR SUPABASE STORAGE
    // =======================================================
    /**
     * Téléverse un fichier dans le bucket Supabase 'justificatifs'
     * @param {File} fichier - Le fichier sélectionné par l'utilisateur
     * @returns {Promise<string|null>} - L'URL publique du fichier téléversé
     */
    async function uploaderJustificatif(fichier) {
        if (!fichier) return null;

        try {
            // Nettoyage et création d'un nom de fichier unique avec timestamp
            const extension = fichier.name.split('.').pop();
            const nomFichierUnique = `scan_${Date.now()}.${extension}`;

            // Transfert vers le bucket Supabase
            const { data, error } = await supabaseClient
                .storage
                .from('justificatifs')
                .upload(nomFichierUnique, fichier, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) {
                throw new Error("Erreur lors de l'upload : " + error.message);
            }

            // Récupération de l'URL publique générée
            const { data: urlData } = supabaseClient
                .storage
                .from('justificatifs')
                .getPublicUrl(nomFichierUnique);

            return urlData.publicUrl;

        } catch (erreur) {
            console.error("Détails erreur uploaderJustificatif :", erreur);
            throw erreur;
        }
    }

    // =======================================================
    // 3. FONCTION PRINCIPALE : ENREGISTREMENT DE LA TRANSACTION
    // =======================================================
    async function enregistrerTransaction(event) {
        event.preventDefault(); // Empêche le rechargement de la page

        const btn = document.getElementById('btnSubmit');
        const messageBox = document.getElementById('messageStatut');
        
        btn.disabled = true;
        btn.textContent = "Enregistrement en cours...";
        afficherMessage("", false);

        try {
            // Récupération des données du formulaire
            const date = document.getElementById('dateTransaction').value;
            const libelle = document.getElementById('libelleTransaction').value;
            const montant = parseFloat(document.getElementById('montantTransaction').value);
            const codeCompte = document.getElementById('compteTransaction').value;
            const inputFichier = document.getElementById('fichierJustificatif');
            const fichier = inputFichier.files[0];

            let urlJustificatif = null;

            // Étape A : Téléversement du justificatif s'il y en a un
            if (fichier) {
                btn.textContent = "Téléversement du justificatif...";
                urlJustificatif = await uploaderJustificatif(fichier);
            }

            // Étape B : Insertion de la transaction dans la table Supabase 'transactions'
            btn.textContent = "Sauvegarde en BDD...";
            const { data, error } = await supabaseClient
                .from('transactions')
                .insert([
                    {
                        date_transaction: date,
                        libelle: libelle,
                        montant: montant,
                        code_compte: codeCompte,
                        justificatif_url: urlJustificatif
                    }
                ]);

            if (error) {
                throw new Error("Erreur base de données : " + error.message);
            }

            // Succès
            afficherMessage("✅ Transaction enregistrée avec succès !", true);
            document.getElementById('formTransaction').reset();
            document.getElementById('dateTransaction').valueAsDate = new Date();

        } catch (err) {
            afficherMessage("❌ " + err.message, false);
        } finally {
            btn.disabled = false;
            btn.textContent = "Enregistrer la transaction";
        }
    }

    // Fonction utilitaire pour afficher les retours visuels
    function afficherMessage(texte, estSucces) {
        const messageBox = document.getElementById('messageStatut');
        if (!texte) {
            messageBox.style.display = 'none';
            return;
        }
        messageBox.style.display = 'block';
        messageBox.className = 'status-message ' + (estSucces ? 'status-success' : 'status-error');
        messageBox.textContent = texte;
    }
</script>

</body>
</html>
