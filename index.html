<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabilité Libérale</title>
    <!-- Chargement du SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1, h2 { color: #1e293b; }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        input, select { flex: 1; min-width: 150px; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1d4ed8; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>🩺 Comptabilité Libérale</h1>

    <!-- SECTION 1 : PLAN COMPTABLE -->
    <div class="section">
        <h2>Plan Comptable du Cabinet</h2>
        
        <!-- Formulaire d'ajout de compte -->
        <div class="form-row">
            <input type="text" id="pcCode" placeholder="Code Compte (ex: 606300)">
            <input type="text" id="pcLibelle" placeholder="Libellé du compte">
            <select id="pcType">
                <option value="Charge">Charge (6...)</option>
                <option value="Produit">Produit (7...)</option>
                <option value="Trésorerie">Trésorerie (5...)</option>
            </select>
            <button onclick="ajouterComptePC()">+ Ajouter au Plan</button>
        </div>

        <!-- Tableau d'affichage des comptes -->
        <table>
            <thead>
                <tr>
                    <th>Code Compte</th>
                    <th>Libellé</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbodyPlanComptable">
                <tr>
                    <td colspan="4" style="text-align: center; color: #888;">Chargement du plan comptable...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SECTION 2 : SAISIE DE TRANSACTION ET SCAN -->
    <div class="section">
        <h2>Nouvelle Transaction & Scan</h2>
        <form id="formTransaction" onsubmit="enregistrerTransaction(event)">
            <div class="form-row">
                <input type="date" id="txDate" required>
                <input type="text" id="txLibelle" placeholder="Description de la dépense" required>
                <input type="number" step="0.01" id="txMontant" placeholder="Montant (€)" required>
            </div>
            
            <div class="form-row">
                <select id="txCompte" required>
                    <option value="606300">606300 - Achats petit matériel</option>
                    <option value="613200">613200 - Loyer professionnel</option>
                    <option value="625100">625100 - Frais de déplacements</option>
                    <option value="706000">706000 - Honoraires</option>
                </select>
                <input type="file" id="txFile" accept="image/*,application/pdf" capture="environment">
            </div>

            <button type="submit" style="width: 100%;">Enregistrer avec Justificatif</button>
        </form>
    </div>
</div>

<!-- Liaison vers le fichier de logique JavaScript -->
<script src="app.js"></script>

</body>
</html>
